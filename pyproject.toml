[project]
name = "ngff-rfc8"
version = "0.0.1"
description = "Minimal validation tools for NGFF RFC-8 collections"
readme = "README.md"
authors = [
    { name = "Sonia Zorba", email = "sonia.zorba@exact-lab.it" },
    { name = "Tommaso Comparin", email = "tommaso.comparin@exact-lab.it" },
]
requires-python = ">=3.12,<=3.15"
dependencies = [
    "jsonschema >=4.26.0, <4.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
ngff-rfc8-validate = "ngff_rfc8.cli:cmd_validate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = true
packages = ["python/src/ngff_rfc8"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ngff_rfc8/schemas"


[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"
